#============================================================
#  NodePool - Karpenter Node Provisioning Rules
#============================================================
# This manifest defines the node provisioning rules for Karpenter.
# It specifies instance types, capacity types, resource limits,
# and disruption policies.
#
# Usage:
#   kubectl apply -f nodepool.yaml
#
# Reference: https://karpenter.sh/docs/concepts/nodepools/
#============================================================

apiVersion: karpenter.sh/v1
kind: NodePool

metadata:
  name: default
  labels:
    karpenter.sh/discovery: finishline-infra-app-dev-eks

spec:
  template:
    metadata:
      labels:
        karpenter.sh/discovery: finishline-infra-app-dev-eks
        project: finishline-infra-app
        environment: dev

    spec:
      # Reference to the EC2NodeClass that defines EC2 configuration
      nodeClassRef:
        name: default

      # Requirements for node selection
      # Karpenter will provision nodes matching these criteria
      requirements:
        # Architecture - amd64 for x86_64 instances
        - key: kubernetes.io/arch
          operator: In
          values:
            - amd64

        # Operating system - Linux
        - key: kubernetes.io/os
          operator: In
          values:
            - linux

        # Capacity type - spot for cost optimization, on-demand for reliability
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - spot
            - on-demand

        # Instance types - Karpenter will choose from these options
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - m5.large
            - m5.xlarge
            - c5.large

      # Node expiration - nodes are terminated after this duration
      # Helps with cost optimization and security patching
      expireAfter: 720h

      # Kubelet configuration for nodes
      kubelet:
        # Maximum pods per node
        maxPods: 110
        # System reserved resources
        systemReserved:
          cpu: 100m
          memory: 100Mi
        # Kube reserved resources
        kubeReserved:
          cpu: 100m
          memory: 100Mi
        # Eviction thresholds
        evictionHard:
          memory.available: 100Mi
          nodefs.available: 10%
        evictionSoft:
          memory.available: 200Mi
          nodefs.available: 15%

  # Resource limits - prevents runaway provisioning
  limits:
    cpu: '50'

  # Disruption settings - controls node consolidation and deletion
  disruption:
    # Consolidation policy - WhenEmpty removes nodes with no workload pods
    consolidationPolicy: WhenEmpty
    # Wait time before consolidating
    consolidateAfter: 30s

  # Weight for node pool selection when multiple pools exist
  # Higher weight = preferred
  weight: 100
