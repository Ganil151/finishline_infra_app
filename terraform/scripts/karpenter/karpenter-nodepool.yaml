---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
  labels:
    karpenter.sh/discovery: "${cluster_name}"
spec:
  template:
    spec:
      nodeClassRef:
        apiVersion: karpenter.k8s.aws/v1
        kind: EC2NodeClass
        name: default
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: [${join(", ", [for v in karpenter_capacity_types : "\"${v}\""])}]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: [${join(", ", [for v in karpenter_instance_types : "\"${v}\""])}]
      expireAfter: 720h
  limits:
    cpu: "${karpenter_max_cpu}"
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30s
  weight: 100